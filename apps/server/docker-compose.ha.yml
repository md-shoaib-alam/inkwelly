# Single-VPS HA topology (spec §6): Traefik + 3 core-pinned Bun APIs + worker.
# 4 vCPU layout — scale up = add backendN and bump cpuset. Rule: API procs = vCPUs - 1.
# Core 0: Traefik + Redis (from docker-compose.yml) + OS. Cores 1-3: one Bun API each.
# Postgres is NOT here: it lives on the managed node (or see spec §6b for all-in-one).
# Bring-up: `docker compose -f docker-compose.yml -f docker-compose.ha.yml up -d`
# (base file provides redis + pgbouncer; this file overrides backend with 3 pinned replicas).
services:
  traefik:
    image: traefik:v3.1
    container_name: school-traefik
    restart: always
    cpuset: "0"
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?ACME_EMAIL must be set}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-data:/letsencrypt
    networks:
      - app-network

  backend1: &backend
    build:
      context: .
      dockerfile: Dockerfile
    image: school-backend:secure
    container_name: school-saas-api-1
    restart: always
    expose:
      - "4000"
    cpuset: "1"
    depends_on:
      - redis
      - pgbouncer
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=warn
      - TZ=Asia/Kolkata
      - START_WORKERS=false
      # XFF trusted only from Traefik's docker network (Task 4 fix).
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-172.18.0.0/16}
      # Auth cache knobs (spec §3): TTL 0 disables the cache (rollback).
      - AUTH_CACHE_TTL_MS=${AUTH_CACHE_TTL_MS:-5000}
      # Argon2 tune knobs (spec §4).
      - ARGON2_MEMORY_COST=${ARGON2_MEMORY_COST:-19456}
      - ARGON2_TIME_COST=${ARGON2_TIME_COST:-2}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must point at the managed node or pgbouncer}
      - DIRECT_URL=${DIRECT_URL:?DIRECT_URL must be set}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=4000
      - CORS_ORIGIN=${CORS_ORIGIN}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
      - POSTHOG_API_KEY=${POSTHOG_API_KEY}
      - POSTHOG_HOST=${POSTHOG_HOST}
      - SENTRY_DSN=${SENTRY_DSN}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
    healthcheck:
      # wget/curl may be absent from the bun image; bun itself is guaranteed.
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${API_HOST:?API_HOST must be set}`) && PathPrefix(`/api`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=le
      - traefik.http.routers.api.middlewares=redirect-https
      - traefik.http.middlewares.redirect-https.redirectscheme.scheme=https
      - traefik.http.services.api.loadbalancer.server.port=4000
      - traefik.http.services.api.loadbalancer.healthcheck.path=/api/health
      - traefik.http.services.api.loadbalancer.healthcheck.interval=5s
    networks:
      - app-network

  backend2:
    <<: *backend
    container_name: school-saas-api-2
    cpuset: "2"
    labels:
      - traefik.enable=true
      # Router/service declared once on backend1; peers only join the service.
      - traefik.http.services.api.loadbalancer.server.port=4000

  backend3:
    <<: *backend
    container_name: school-saas-api-3
    cpuset: "3"
    labels:
      - traefik.enable=true
      - traefik.http.services.api.loadbalancer.server.port=4000

  # Overrides the base file's worker: pinned to core 0's surplus, API-hosting
  # port mapping removed (Traefik fronts the APIs; the worker serves nothing).
  worker:
    cpuset: "0"
    environment:
      - START_WORKERS=true
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-172.18.0.0/16}

  # The base file's single `backend` service is replaced by backend1-3.
  backend:
    profiles:
      - disabled-in-ha

networks:
  app-network:
    driver: bridge
